services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD:-shop}@db:5432/shop
      REDIS_URL: redis://redis:6379/0
      WEBAPP_URL: https://${DOMAIN}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # HTTPS для Mini App: Caddy сам получает и продлевает сертификат Let's Encrypt для DOMAIN
  caddy:
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
